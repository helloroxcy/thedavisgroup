<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | The Davis Group</title>
  <link rel="icon" href="Images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="Images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="Images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="Images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="components/shared.css">

  <style>

    /* =============================================
       PAGE HERO
    ============================================= */
    .page-hero {
      position: relative;
      height: 100vh;
      height: 100svh;
      min-height: 600px;
      overflow: hidden;
    }

    .page-hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .page-hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 50%;
      will-change: filter;
    }

    .page-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(41,43,51,0.25) 0%,
        rgba(41,43,51,0.05) 40%,
        rgba(41,43,51,0.60) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Foreground layer - content at bottom */
    .page-hero-fg {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      will-change: transform;
    }
    .page-hero-fg > * { pointer-events: auto; }

    .page-hero-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      color: var(--white);
      padding: 0 24px 10vh;
    }

    .page-hero-title {
      font-family: var(--font-serif);
      font-size: 53px;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      line-height: 1.08;
      margin-bottom: 20px;
    }

    .hero-line-1,
    .hero-tagline {
      display: block;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  transform 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .hero-tagline {
      font-family: var(--font-nav);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .page-hero-content.visible .hero-line-1  { opacity: 1; transform: none; transition-delay: 0.10s; }
    .page-hero-content.visible .hero-tagline { opacity: 0.8; transform: none; transition-delay: 0.32s; }

    @media (max-width: 768px) {
      .page-hero-title { font-size: 42px; letter-spacing: 4px; }
    }

    /* =============================================
       CONTACT SECTION  (reuses .network dark palette)
    ============================================= */
    .contact-section {
      background: var(--dark);
      padding: 104px 0 104px;
      position: relative;
      overflow: hidden;
    }

    /* Big watermark word in the background */
    .contact-section::after {
      content: 'CONTACT';
      position: absolute;
      right: -60px;
      bottom: -40px;
      font-family: var(--font-serif);
      font-size: clamp(80px, 12vw, 160px);
      font-weight: 400;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #1B1C21;
      pointer-events: none;
      white-space: nowrap;
      line-height: 1;
      z-index: 0;
    }

    .contact-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 40px;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 80px;
      align-items: start;
      position: relative;
      z-index: 1;
    }

    /* ── Left column: info ── */
    .contact-info {
      padding-top: 6px;
    }

    .contact-info-heading {
      font-family: var(--font-serif);
      font-size: clamp(32px, 3.5vw, 48px);
      font-weight: 400;
      color: var(--white);
      text-transform: uppercase;
      white-space: nowrap;
      letter-spacing: 3px;
      line-height: 1.1;
      margin-bottom: 36px;
    }

    .contact-info-phone {
      display: block;
      font-family: var(--font-nav);
      font-size: 18px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.5px;
      margin-bottom: 18px;
      transition: opacity var(--ease);
      text-decoration: none;
    }
    .contact-info-phone:hover { opacity: 0.75; }

    .contact-info-line {
      font-family: var(--font-nav);
      font-size: 13px;
      font-weight: 300;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.3px;
      line-height: 2;
    }

    .contact-info-block {
      margin-top: 28px;
    }

    /* ── Right column: form ── */
    .contact-form-wrap { padding-top: 6px; }

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .contact-inner { grid-template-columns: 1fr 1.6fr; gap: 60px; }
    }

    @media (max-width: 768px) {
      .contact-section { padding: 72px 0 80px; }
      .contact-inner {
        grid-template-columns: 1fr;
        gap: 52px;
        padding: 0 24px;
      }
      .page-hero-content { padding: 0 32px 15vh; }
    }

  </style>
</head>
<body>

  <div id="header-mount"></div>

  <!-- ============================================================
       HERO
  ============================================================ -->
  <section class="page-hero">
    <div class="page-hero-bg">
      <img src="Images/Contact-hero-2x.jpg" alt="Palos Verdes coastal view" id="heroBgImg">
    </div>
    <div class="page-hero-overlay"></div>
    <div class="page-hero-fg" id="heroFg">
      <div class="page-hero-content" id="heroContent">
        <h1 class="page-hero-title">
          <span class="hero-line-1">Contact</span>
        </h1>
        <p class="hero-tagline">We would enjoy hearing from you</p>
      </div>
      <button class="hero-scroll-down" id="heroScrollDown" aria-label="Scroll down">
        <svg viewBox="0 0 24 24"><polyline points="4 9 12 17 20 9"/></svg>
      </button>
    </div>
  </section>

  <!-- ============================================================
       CONTACT SECTION
  ============================================================ -->
  <section class="contact-section">
    <div class="contact-inner">

      <!-- Info -->
      <div class="contact-info reveal">
        <h2 class="contact-info-heading">Say Hello</h2>
        <a href="tel:+13109208812" class="contact-info-phone">(310) 920-8812</a>
        <p class="contact-info-line">Monday - Friday, 9am - 5:30pm</p>
        <div class="contact-info-block">
          <p class="contact-info-line">450 Silver Spur Road</p>
          <p class="contact-info-line">Palos Verdes, CA 90275</p>
        </div>
      </div>

      <!-- Form -->
      <div class="contact-form-wrap reveal" style="transition-delay: 0.15s;">
        <form class="contact-form" name="contact" method="POST" action="/form-success.html" data-netlify="true" netlify-honeypot="_honey">

          <div class="form-field">
            <label for="fname">Name</label>
            <input type="text" id="fname" name="name" placeholder="First and Last" autocomplete="name">
          </div>

          <div class="form-field">
            <label for="femail">Email</label>
            <input type="email" id="femail" name="email" placeholder="Email" autocomplete="email">
          </div>

          <div class="form-field">
            <label for="fcity">City of Interest</label>
            <input type="text" id="fcity" name="city" placeholder="City of Interest">
          </div>

          <div class="form-field">
            <label for="fmessage">Message</label>
            <textarea id="fmessage" name="message" placeholder="Message"></textarea>
          </div>

          <button type="submit" class="form-submit">Send</button>

        </form>
      </div>

    </div>
  </section>


  <div id="footer-mount"></div>
  <script src="components/header.js"></script>
  <script src="components/footer.js"></script>
  <script>
    'use strict';

    /* ─── Hero text reveal ─── */
    var heroContent = document.getElementById('heroContent');
    if (heroContent) setTimeout(function() { heroContent.classList.add('visible'); }, 400);

    /* ─── Scroll-down arrow ─── */
    var scrollBtn = document.getElementById('heroScrollDown');
    if (scrollBtn) {
      scrollBtn.addEventListener('click', function() {
        document.querySelector('.contact-section').scrollIntoView({ behavior: 'smooth' });
      });
    }

    /* ─── Parallax ─── */
    (function () {
    var heroEl   = document.querySelector('.page-hero');
    var heroFg   = document.getElementById('heroFg');
    var bgImg    = document.getElementById('heroBgImg');
    var FG_SPEED = 0.45;
    var MAX_BLUR = 10;

    function onScroll() {
      var heroH    = heroEl ? heroEl.offsetHeight : window.innerHeight;
      var y        = Math.min(window.scrollY, heroH);
      var progress = y / heroH;
      if (heroFg) heroFg.style.transform = 'translateY(' + (-y * FG_SPEED) + 'px)';
      var blurPx = progress * MAX_BLUR;
      if (bgImg) bgImg.style.filter = blurPx > 0.05 ? 'blur(' + blurPx.toFixed(2) + 'px)' : '';
    }

    window.addEventListener('scroll', onScroll, { passive: true });
  })();

    /* ─── Scroll reveal ─── */
    var reveals = document.querySelectorAll('.reveal');
    var ro = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) { e.target.classList.add('visible'); ro.unobserve(e.target); }
      });
    }, { threshold: 0.1 });
    reveals.forEach(function(el) { ro.observe(el); });
  </script>

</body>
</html>
